<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="AI job application assistant illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="480" height="200" fill="url(#bg)"/>
  <rect width="480" height="200" fill="url(#dots)"/>
  <circle cx="55" cy="30" r="64" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="430" cy="175" r="58" fill="#2dd4bf" opacity="0.05"/>

  <!-- Cover letter sheet -->
  <g transform="translate(96,36)">
    <rect x="0" y="0" width="150" height="128" rx="10" fill="#16223a" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="16" y="18" width="80" height="8" rx="4" fill="#e2e8f0" opacity="0.85"/>
    <rect x="16" y="36" width="118" height="6" rx="3" fill="#94a3b8" opacity="0.6"/>
    <rect x="16" y="50" width="118" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>
    <rect x="16" y="64" width="100" height="6" rx="3" fill="#94a3b8" opacity="0.5"/>
    <rect x="16" y="78" width="118" height="6" rx="3" fill="#94a3b8" opacity="0.45"/>
    <rect x="16" y="92" width="90" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>
    <rect x="16" y="108" width="56" height="8" rx="4" fill="#2dd4bf" opacity="0.55"/>
  </g>

  <!-- Spark / AI chip -->
  <g transform="translate(286,52)">
    <rect x="0" y="0" width="112" height="112" rx="56" fill="#16223a" stroke="#2dd4bf" stroke-width="2"/>
    <!-- simple neural sparkle -->
    <circle cx="56" cy="34" r="9" fill="#2dd4bf" opacity="0.85"/>
    <circle cx="28" cy="70" r="8" fill="#94a3b8" opacity="0.8"/>
    <circle cx="84" cy="70" r="8" fill="#94a3b8" opacity="0.8"/>
    <circle cx="56" cy="88" r="7" fill="#2dd4bf" opacity="0.6"/>
    <path d="M56 43 30 64M56 43 82 64M34 74 50 83M78 74 62 83" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Arrow from letter to AI -->
  <g transform="translate(248,90)" stroke="#2dd4bf" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M0 0h28M28 0l-8-8M28 0l-8 8" opacity="0.85"/>
  </g>

  <!-- Sparkles -->
  <g stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M398 44v12M392 50h12"/>
    <path d="M66 168v12M60 174h12"/>
  </g>
</svg>
