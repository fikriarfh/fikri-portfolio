<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Student Information System illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="480" height="200" fill="url(#bg)"/>
  <rect width="480" height="200" fill="url(#dots)"/>
  <circle cx="430" cy="24" r="72" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="40" cy="185" r="64" fill="#2dd4bf" opacity="0.05"/>

  <!-- Student ID card -->
  <g transform="translate(150,46)">
    <rect x="0" y="0" width="190" height="106" rx="13" fill="#16223a" stroke="#2dd4bf" stroke-width="2"/>
    <rect x="15" y="18" width="46" height="46" rx="9" fill="#2dd4bf" opacity="0.14"/>
    <circle cx="38" cy="34" r="10" fill="#2dd4bf" opacity="0.6"/>
    <path d="M24 54c3-9 25-9 28 0" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <rect x="76" y="22" width="96" height="9" rx="4.5" fill="#e2e8f0" opacity="0.85"/>
    <rect x="76" y="38" width="66" height="7" rx="3.5" fill="#94a3b8" opacity="0.7"/>
    <rect x="76" y="51" width="80" height="7" rx="3.5" fill="#94a3b8" opacity="0.5"/>
    <rect x="15" y="78" width="160" height="13" rx="6.5" fill="#2dd4bf" opacity="0.13"/>
    <rect x="24" y="81" width="34" height="7" rx="3.5" fill="#2dd4bf" opacity="0.6"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(368,34)">
    <path d="M0 14 34 26 0 38-34 26Z" fill="#2dd4bf" opacity="0.85"/>
    <path d="M-16 32v10c0 8 32 8 32 0V32L0 38Z" fill="#2dd4bf" opacity="0.45"/>
    <path d="M34 26v16" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="34" cy="46" r="3.5" fill="#e2e8f0"/>
  </g>

  <!-- Database cylinder -->
  <g transform="translate(74,108)">
    <path d="M-28 0v42c0 10 56 10 56 0V0" fill="#16223a" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="28" ry="10" fill="#16223a" stroke="#2dd4bf" stroke-width="2"/>
    <path d="M-28 15c0 9 56 9 56 0M-28 30c0 9 56 9 56 0" fill="none" stroke="#94a3b8" stroke-width="1.6" opacity="0.7"/>
  </g>

  <!-- Floating checkmarks -->
  <g transform="translate(48,42)" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M0 8 5 13 14 2"/>
  </g>
  <g transform="translate(430,150)" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M0 8 5 13 14 2"/>
  </g>
</svg>
