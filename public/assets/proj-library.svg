<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Library management illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="480" height="200" fill="url(#bg)"/>
  <rect width="480" height="200" fill="url(#dots)"/>
  <circle cx="35" cy="30" r="66" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="445" cy="180" r="62" fill="#2dd4bf" opacity="0.05"/>

  <!-- Bookshelf (background) -->
  <g transform="translate(58,38)">
    <rect x="0" y="0" width="118" height="112" rx="9" fill="#16223a" stroke="#94a3b8" stroke-width="2"/>
    <path d="M0 55h118" stroke="#94a3b8" stroke-width="1.6" opacity="0.6"/>
    <rect x="12" y="14" width="10" height="41" rx="2" fill="#2dd4bf" opacity="0.55"/>
    <rect x="26" y="20" width="10" height="35" rx="2" fill="#94a3b8" opacity="0.5"/>
    <rect x="40" y="12" width="10" height="43" rx="2" fill="#e2e8f0" opacity="0.4"/>
    <rect x="54" y="22" width="10" height="33" rx="2" fill="#2dd4bf" opacity="0.4"/>
    <rect x="12" y="68" width="10" height="44" rx="2" fill="#94a3b8" opacity="0.45"/>
    <rect x="26" y="74" width="10" height="38" rx="2" fill="#2dd4bf" opacity="0.5"/>
    <rect x="40" y="66" width="10" height="46" rx="2" fill="#2dd4bf" opacity="0.35"/>
    <rect x="54" y="76" width="10" height="36" rx="2" fill="#e2e8f0" opacity="0.35"/>
    <rect x="72" y="14" width="38" height="98" rx="5" fill="#2dd4bf" opacity="0.1"/>
  </g>

  <!-- Open book (foreground) -->
  <g transform="translate(258,64)">
    <path d="M0 22C22 6 62 6 82 20v66C62 72 22 72 0 86Z" fill="#16223a" stroke="#2dd4bf" stroke-width="2.4"/>
    <path d="M160 22C138 6 98 6 82 20v66c20-14 60-14 78 0Z" fill="#16223a" stroke="#2dd4bf" stroke-width="2.4"/>
    <path d="M82 20v66" stroke="#2dd4bf" stroke-width="2.4"/>
    <path d="M16 34c14-6 38-8 54-6M16 48c14-6 38-8 54-6M16 62c14-6 38-8 54-6" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M144 34c-14-6-38-8-54-6M144 48c-14-6-38-8-54-6M144 62c-14-6-38-8-54-6" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
    <!-- bookmark -->
    <path d="M112 14h14v30l-7-8-7 8Z" fill="#2dd4bf" opacity="0.85"/>
  </g>

  <!-- Return arrow (borrow/return cycle) -->
  <g transform="translate(252,172)" stroke="#2dd4bf" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M0 8h58M0 8l8-8M0 8l8 8" opacity="0.8"/>
  </g>
</svg>
