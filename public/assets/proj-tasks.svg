<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Task manager illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#94a3b8" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="480" height="200" fill="url(#bg)"/>
  <rect width="480" height="200" fill="url(#dots)"/>
  <circle cx="440" cy="30" r="68" fill="#2dd4bf" opacity="0.07"/>
  <circle cx="42" cy="180" r="60" fill="#2dd4bf" opacity="0.05"/>

  <!-- Clipboard -->
  <g transform="translate(150,30)">
    <rect x="0" y="10" width="180" height="150" rx="13" fill="#16223a" stroke="#2dd4bf" stroke-width="2.4"/>
    <rect x="62" y="0" width="56" height="22" rx="8" fill="#16223a" stroke="#2dd4bf" stroke-width="2.4"/>
    <!-- task 1: done -->
    <rect x="20" y="36" width="20" height="20" rx="6" fill="#2dd4bf" opacity="0.2"/>
    <path d="M24 46l6 6 10-12" stroke="#2dd4bf" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="41" width="104" height="9" rx="4.5" fill="#94a3b8" opacity="0.75"/>
    <!-- task 2: done -->
    <rect x="20" y="70" width="20" height="20" rx="6" fill="#2dd4bf" opacity="0.2"/>
    <path d="M24 80l6 6 10-12" stroke="#2dd4bf" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="75" width="86" height="9" rx="4.5" fill="#94a3b8" opacity="0.75"/>
    <!-- task 3: open -->
    <rect x="20" y="104" width="20" height="20" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="52" y="109" width="98" height="9" rx="4.5" fill="#e2e8f0" opacity="0.8"/>
  </g>

  <!-- Progress bar -->
  <g transform="translate(120,168)">
    <rect x="0" y="0" width="240" height="14" rx="7" fill="#16223a" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="3" y="3" width="158" height="8" rx="4" fill="#2dd4bf" opacity="0.8"/>
    <text x="212" y="11.5" font-family="monospace" font-size="11" fill="#2dd4bf" opacity="0.9">2/3</text>
  </g>

  <!-- Sparkles -->
  <g stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" opacity="0.75">
    <path d="M96 48v12M90 54h12"/>
    <path d="M404 148v12M398 154h12"/>
  </g>
  <circle cx="374" cy="60" r="5" fill="#2dd4bf" opacity="0.5"/>
</svg>
